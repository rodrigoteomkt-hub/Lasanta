<style>

  .menus img{display:block;width:100%;height:auto;border:1px solid var(--hair);border-radius:4px;background:#fff;box-shadow:0 10px 30px -16px rgba(28,26,21,.25)}
  .foot{margin-top:clamp(2rem,5vw,3rem);text-align:center;color:var(--muted);font-size:.9rem;letter-spacing:.02em}
